server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compressible assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Long-cache hashed static assets (Angular emits /<hash>.js etc.)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API calls to the in-cluster FastAPI backend.
    # Service name "backend" is exposed by the Helm chart in the same namespace.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        # Use $http_host (raw Host header with port) instead of $host (port-stripped)
        # — FastAPI uses this to build redirect Location URLs, and dropping the
        # port turns "http://localhost:8080/x" into "http://localhost/x", which
        # breaks the browser's port-forward access.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health endpoint for K8s probes
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Angular SPA fallback — every unmatched route returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
