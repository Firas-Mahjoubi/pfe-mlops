# Trust the front-most proxy's (Cloudflare → cloudflared) X-Forwarded-Proto
# header so the backend builds redirect Location URLs with the correct scheme.
# Fall back to $scheme for port-forward / local dev where no upstream proxy
# sends this header.
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large uploads (zipped code + datasets). nginx's default is 1m,
    # which 413-rejects anything bigger BEFORE it reaches the backend; keep
    # in sync with the ingress annotation proxy-body-size (100m).
    client_max_body_size 100m;

    # Gzip compressible assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Long-cache hashed static assets (Angular emits /<hash>.js etc.)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API calls to the in-cluster FastAPI backend.
    # Service name "backend" is exposed by the Helm chart in the same namespace.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        # Use $http_host (raw Host header with port) instead of $host (port-stripped)
        # — FastAPI uses this to build redirect Location URLs, and dropping the
        # port turns "http://localhost:8080/x" into "http://localhost/x", which
        # breaks the browser's port-forward access.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $forwarded_scheme = Cloudflare's https when present, else $scheme.
        # Without this, the in-cluster cloudflared→nginx hop's http overrides
        # the real scheme, and FastAPI builds http:// redirect Locations that
        # the browser refuses to follow as Mixed Content.
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health endpoint for K8s probes
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Never cache the HTML entry point. Angular chunks are content-hashed
    # (so they can safely cache forever — see the location ~* block above),
    # but if the browser caches index.html itself, it'll keep pointing at
    # OLD chunk hashes after a deploy and run stale code. Always-fresh HTML
    # is the fix that lets every reload pick up the latest chunk references.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    # Angular SPA fallback — every unmatched route returns index.html.
    # Same no-cache treatment so /projects, /dashboard, etc. always re-fetch.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri $uri/ /index.html;
    }
}
