# Runs Alembic migrations against Postgres before backend pods come up.
# Helm hook: pre-install (first deploy) + pre-upgrade (each subsequent helm upgrade).
apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-{{ .Release.Revision }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: alembic
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "mlops.labels" . | nindent 8 }}
        app.kubernetes.io/component: alembic
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
          command: ["sh", "-c"]
          args:
            - |
              for i in $(seq 1 60); do
                if pg_isready -h postgres -p 5432 -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}; then
                  echo "Postgres ready"
                  exit 0
                fi
                echo "Waiting for Postgres… ($i/60)"
                sleep 2
              done
              echo "Timed out waiting for Postgres"
              exit 1
      containers:
        - name: alembic
          image: {{ include "mlops.image" (dict "root" . "repo" .Values.backend.image.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: DATABASE_URL
          command: ["alembic"]
          args: ["upgrade", "head"]
