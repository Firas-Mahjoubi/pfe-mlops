# ─── Global / Image registry ────────────────────────────────────────────────
image:
  registry: acrmlopspfedemov2.azurecr.io
  tag: v1
  pullPolicy: IfNotPresent

# Name of the docker-registry secret used to pull from ACR.
# Created out-of-band: see infrastructure/azure/RUNBOOK.md PART 5.0
imagePullSecret: acr-pull-secret

# Namespace where everything is deployed (must already exist)
namespace: mlops

# ─── Ingress / DNS ──────────────────────────────────────────────────────────
# Public hostname served via Cloudflare Tunnel. The in-cluster Ingress
# resource is unused by the tunnel path (cloudflared targets the frontend
# Service directly), but `host` still drives the backend's CORS_ORIGINS env
# var. The Azure cloudapp.azure.com URL is left unreachable from the internet
# because the INSOMEA NSG blocks 80/443 on the AKS node subnet -- we cannot
# add an inbound rule (the NSG lives in the AKS-managed MC_* RG outside our
# Contributor scope). See infrastructure/k8s/cloudflared/ for the tunnel.
ingress:
  host: mlops.firasmahjoubi.app
  className: nginx
  tlsSecretName: mlops-tls
  clusterIssuer: letsencrypt-prod

# ─── Backend (FastAPI) ──────────────────────────────────────────────────────
backend:
  image:
    repository: backend     # full = {{ .Values.image.registry }}/{{ .Values.backend.image.repository }}:{{ .Values.image.tag }}
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }

# ─── Frontend (Angular + nginx) ─────────────────────────────────────────────
frontend:
  image:
    repository: frontend
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# ─── Postgres (in-cluster) ──────────────────────────────────────────────────
postgres:
  image: postgres:16-alpine
  database: mlops_platform
  user: mlops
  storageSize: 8Gi
  storageClass: managed-csi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }

# ─── MinIO (in-cluster, S3-compatible object store) ─────────────────────────
minio:
  image: minio/minio:RELEASE.2024-12-18T13-15-44Z
  storageSize: 10Gi
  storageClass: managed-csi
  buckets:
    - mlflow-artifacts
    - user-code
    - models
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# ─── MLflow tracking server ─────────────────────────────────────────────────
mlflow:
  image: ghcr.io/mlflow/mlflow:v2.18.0
  storageSize: 5Gi
  storageClass: managed-csi
  artifactBucket: mlflow-artifacts
  resources:
    # Gunicorn boots 4 sync workers + psycopg2 + boto3 -- 512Mi gets OOMKilled
    # within ~60s under any load. 1.5Gi gives comfortable headroom.
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1536Mi }

# ─── Kubeflow Pipelines connection (already installed cluster-side) ─────────
kfp:
  host: http://ml-pipeline.kubeflow.svc.cluster.local:8888
  namespace: kubeflow

# ─── KServe ─────────────────────────────────────────────────────────────────
kserve:
  namespace: mlops          # InferenceServices live here
  serviceAccount: kserve-sa # already created via mlops-namespace.yaml

# ─── Existing secret holding sensitive values (created in RUNBOOK 5.1) ──────
secretName: mlops-secrets   # keys: DATABASE_URL, JWT_SECRET_KEY, MINIO_ACCESS_KEY, MINIO_SECRET_KEY, POSTGRES_PASSWORD
