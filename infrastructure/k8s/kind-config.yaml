kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mlops
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30500
        hostPort: 30500
        protocol: TCP
      - containerPort: 30800
        hostPort: 30800
        protocol: TCP
      - containerPort: 30420
        hostPort: 30420
        protocol: TCP
      - containerPort: 30900
        hostPort: 30900
        protocol: TCP
      - containerPort: 30901
        hostPort: 30901
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            "service-node-port-range": "30000-32767"
