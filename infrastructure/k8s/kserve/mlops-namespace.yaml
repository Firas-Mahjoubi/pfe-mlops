apiVersion: v1
kind: Namespace
metadata:
  name: mlops
---
# Secret with MinIO S3 credentials. KServe storage-initializer reads
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars; the s3.* annotations
# tell it to point at the in-cluster MinIO service.
#
# For local dev (KinD running outside cluster), override the s3-endpoint
# annotation to "host.docker.internal:9000" via kustomize or kubectl patch.
apiVersion: v1
kind: Secret
metadata:
  name: minio-s3-creds
  namespace: mlops
  annotations:
    serving.kserve.io/s3-endpoint: minio.mlops.svc.cluster.local:9000
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-verifyssl: "0"
    serving.kserve.io/s3-region: us-east-1
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin123
---
# ServiceAccount that InferenceServices use; references the credentials secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-sa
  namespace: mlops
secrets:
  - name: minio-s3-creds
